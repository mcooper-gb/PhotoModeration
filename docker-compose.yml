version: '3.8'

services:
  photo-moderation:
    build: .
    container_name: photo-moderation
    volumes:
      # Directory to scan for new media files
      - ./images:/data/scan

      # Persistent database to track processed files
      - photo-moderation-db:/data/db

      # Censored images output (temporary - cleaned after notification)
      - ./censored:/data/censored

      # NudeNet model cache (persists models between restarts)
      - nudenet-models:/root/.NudeNet

    environment:
      # Email notification settings
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-your-email@example.com}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your-smtp-user@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-your-smtp-password}

      # Application settings
      - BATCH_SIZE=${BATCH_SIZE:-10}
      - SCAN_DIR=/data/scan
      - CENSORED_DIR=/data/censored
      - DB_PATH=/data/db/scanned.db

    restart: unless-stopped

    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Named volume for persistent database
  photo-moderation-db:

  # Named volume for NudeNet models (downloaded once, reused)
  nudenet-models:
