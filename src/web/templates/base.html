<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Photo Moderation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Photo Moderation</a>
    <nav>
        <a href="{{ url_for('index', status='pending') }}">Queue</a>
        <a href="{{ url_for('index', status='kept') }}">Kept</a>
        <a href="{{ url_for('index', status='deleted') }}">Deleted</a>
        <a href="{{ url_for('index', status='error') }}">Failed</a>
    </nav>
</header>

<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
